name: publish-plugin

on:
  workflow_dispatch:

jobs:
  publish-plugin:
    runs-on: ubuntu-latest
    env:
      WINDY_API_KEY: '${{ secrets.WINDY_API_KEY }}'

    steps:
      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publication is only allowed from main" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Build
        run: |
          npm install
          npm run build

      - name: Require final plugin version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const finalVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$/;
          for (const file of ['package.json', 'dist/plugin.json']) {
            const { version } = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (typeof version !== 'string' || !finalVersion.test(version)) {
              throw new Error(`Publication refused: ${file} version ${version} is not a final version`);
            }
          }
          NODE

      - name: Publish Plugin
        run: |
          if [ -z "$WINDY_API_KEY" ]; then
            echo "Secret WINDY_API_KEY is not configured" >&2
            exit 1
          fi

          cd dist
          echo "Creating plugin archive..."
          echo "{\"repositoryName\": \"${{ github.repository }}\", \"commitSha\": \"${{ github.sha }}\", \"repositoryOwner\": \"${{ github.repository_owner }}\"}" > /tmp/plugin-info.json
          mv plugin.json /tmp
          jq -s '.[0] * .[1]' /tmp/plugin.json /tmp/plugin-info.json > plugin.json
          tar cf ../plugin.tar .

          echo "Publishing plugin..."
          curl -s --fail-with-body -XPOST 'https://node.windy.com/plugins/v1.0/upload' \
            -H "x-windy-api-key: ${WINDY_API_KEY}" \
            -F "plugin_archive=@../plugin.tar"
